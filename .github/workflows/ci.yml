name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: bash -n install.sh multicast-rtp-audio-bridge-installer.sh src/scripts/*.sh
      - run: python -m py_compile src/web/app.py
      - run: shellcheck install.sh multicast-rtp-audio-bridge-installer.sh src/scripts/*.sh
