<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MulticastRTPAudioBridge</title>
<style>body{font-family:system-ui;margin:0;background:#f4f5f7;color:#202124}.wrap{max-width:850px;margin:40px auto;padding:0 16px}.card{background:white;border-radius:14px;padding:22px;box-shadow:0 6px 24px #0001;margin-bottom:16px}button,input{font:inherit}button{padding:10px 14px;margin:4px;border:0;border-radius:8px;cursor:pointer}.primary{background:#2563eb;color:white}.danger{background:#dc2626;color:white}.bar{height:15px;background:#ddd;border-radius:8px;overflow:hidden}.fill{height:100%;width:0;background:#16a34a}.mono{font-family:monospace}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}</style></head><body><main class="wrap">
<div class="card"><h1>MulticastRTPAudioBridge</h1><p>Spotify Connect + Line-In → RTP <span class="mono">{{ cfg.MCAST_IP }}:{{ cfg.MCAST_PORT }}</span></p><a href="/diagnostics">Diagnostica</a></div>
<div class="card"><h2>Sorgente</h2><div class="row"><button class="primary" onclick="source('spotify')">Spotify</button><button class="primary" onclick="source('linein')">Line-In</button><button class="danger" onclick="source('off')">Stop</button><strong id="state">...</strong></div></div>
<div class="card"><h2>Volume</h2><input id="vol" type="range" min="0" max="1.5" step="0.01" value="{{ cfg.STREAM_VOLUME }}"><button class="primary" onclick="volume()">Applica</button><span id="voltxt"></span></div>
<div class="card"><h2>VU meter</h2><div class="bar"><div id="meter" class="fill"></div></div><p><span id="metertext">0%</span> — <span id="device" class="mono">-</span></p><p id="metererr"></p></div>
</main><script>
async function api(url,body){const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const j=await r.json();if(!r.ok)alert(j.error||'Errore');return j}
async function source(s){await api('/api/source',{source:s});refresh()}
async function volume(){await api('/api/volume',{volume:parseFloat(document.getElementById('vol').value)});refresh()}
async function refresh(){const s=await (await fetch('/api/status')).json();document.getElementById('state').textContent=s.spotify_on?'SPOTIFY':s.linein_on?'LINE-IN':'OFF';document.getElementById('voltxt').textContent=' '+Number(s.volume).toFixed(2)}
async function poll(){const m=await (await fetch('/api/meter')).json();const n=Math.max(0,Math.min(100,m.level||0));document.getElementById('meter').style.width=n+'%';document.getElementById('metertext').textContent=n+'%';document.getElementById('device').textContent=m.device||'-';document.getElementById('metererr').textContent=m.error||''}
refresh();poll();setInterval(refresh,3000);setInterval(poll,250)</script></body></html>
