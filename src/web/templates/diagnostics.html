<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Diagnostica MRAB</title><style>body{font-family:system-ui;max-width:900px;margin:40px auto;padding:0 16px}pre{background:#111;color:#eee;padding:14px;overflow:auto}input,button{font:inherit;padding:8px;margin:4px}</style></head><body><a href="/">← Home</a><h1>Diagnostica</h1>
<h2>Configurazione</h2><p>Spotify name <input id="name" value="{{ cfg.SPOTIFY_NAME }}"><button onclick="setName()">Salva</button></p><p>Line-In <input id="linein" value="{{ cfg.LINEIN_CAPTURE }}"><button onclick="setLinein()">Salva</button></p>
<h2>arecord -l</h2><pre>{{ arecord }}</pre><h2>aplay -l</h2><pre>{{ aplay }}</pre>
<script>async function post(u,b){const r=await fetch(u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});const j=await r.json();if(!r.ok)alert(j.error||'Errore');else alert('Salvato')};function setName(){post('/api/spotify-name',{name:document.getElementById('name').value})};function setLinein(){post('/api/linein',{device:document.getElementById('linein').value})}</script></body></html>
